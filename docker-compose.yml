services:
  backend:
    image: emna08/360evo-backend:1.0.0
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5001:5001"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  frontend:
    image: emna08/360evo-frontend:1.0.0
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_started
    mem_limit: 256m
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v2.53.4
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=2GB"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus-config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    networks:
      - app-network

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    env_file:
      - ./monitoring/.env 
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "127.0.0.1:3007:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 384m
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    mem_limit: 128m
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  grafana-data:
  prometheus-data:
